<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustrasi jaringan IT Help Desk">
  <defs>
    <!-- Cahaya lembut untuk memberi kedalaman, menyatu dengan gradient ungu -->
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55" />
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.18" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="0.6" stop-color="#6366f1" stop-opacity="0.14" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.35" />
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0" />
    </radialGradient>

    <!-- Gradien garis sirkuit -->
    <linearGradient id="traceA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.75" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="traceB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.6" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="traceC" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.04" />
    </linearGradient>

    <!-- Masker agar ilustrasi memudar ke tepi dan menyatu dengan gradient -->
    <radialGradient id="fade" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="1" />
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.85" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="softEdge">
      <rect width="800" height="1000" fill="url(#fade)" />
    </mask>
  </defs>

  <g mask="url(#softEdge)">
    <!-- Glow utama -->
    <ellipse cx="640" cy="180" rx="360" ry="360" fill="url(#glowA)" />
    <ellipse cx="140" cy="820" rx="340" ry="340" fill="url(#glowB)" />
    <ellipse cx="420" cy="520" rx="260" ry="260" fill="url(#glowC)" />

    <!-- Jalur sirkuit / jaringan -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-40 300 H180 a24 24 0 0 1 24 24 V470 a24 24 0 0 0 24 24 H420"
        stroke="url(#traceA)" stroke-width="2" />
      <path d="M840 420 H660 a24 24 0 0 0-24 24 V620 a24 24 0 0 1-24 24 H470"
        stroke="url(#traceB)" stroke-width="2" />
      <path d="M120 1000 V760 a24 24 0 0 1 24-24 H360 a24 24 0 0 0 24-24 V560"
        stroke="url(#traceC)" stroke-width="2" />
      <path d="M700 1000 V840 a24 24 0 0 0-24-24 H520 a24 24 0 0 1-24-24 V660"
        stroke="url(#traceA)" stroke-width="2" />
      <path d="M-40 640 H120 a24 24 0 0 0 24-24 V420"
        stroke="url(#traceB)" stroke-width="2" />
      <path d="M840 120 H700 a24 24 0 0 0-24 24 V300 a24 24 0 0 1-24 24 H560"
        stroke="url(#traceC)" stroke-width="2" />
    </g>

    <!-- Node / titik koneksi -->
    <g fill="#c4b5fd">
      <circle cx="180" cy="300" r="5" fill-opacity="0.9" />
      <circle cx="420" cy="494" r="6" fill-opacity="0.85" />
      <circle cx="660" cy="420" r="5" fill-opacity="0.8" />
      <circle cx="470" cy="644" r="6" fill-opacity="0.75" />
      <circle cx="360" cy="712" r="5" fill-opacity="0.7" />
      <circle cx="384" cy="560" r="5" fill-opacity="0.7" />
      <circle cx="520" cy="636" r="5" fill-opacity="0.65" />
      <circle cx="144" cy="616" r="5" fill-opacity="0.6" />
      <circle cx="560" cy="324" r="5" fill-opacity="0.6" />
    </g>

    <!-- Titik-titik halus (partikel) -->
    <g fill="#e9d5ff">
      <circle cx="300" cy="180" r="2.5" fill-opacity="0.5" />
      <circle cx="520" cy="260" r="2" fill-opacity="0.45" />
      <circle cx="240" cy="420" r="2.5" fill-opacity="0.4" />
      <circle cx="600" cy="540" r="2" fill-opacity="0.4" />
      <circle cx="340" cy="640" r="2.5" fill-opacity="0.35" />
      <circle cx="680" cy="700" r="2" fill-opacity="0.3" />
      <circle cx="200" cy="880" r="2.5" fill-opacity="0.3" />
      <circle cx="460" cy="860" r="2" fill-opacity="0.28" />
      <circle cx="120" cy="240" r="2" fill-opacity="0.35" />
      <circle cx="740" cy="300" r="2" fill-opacity="0.3" />
    </g>

    <!-- Aksen cincin tipis -->
    <g fill="none" stroke="#a78bfa" stroke-opacity="0.18">
      <circle cx="640" cy="180" r="150" stroke-width="1.5" />
      <circle cx="640" cy="180" r="230" stroke-width="1" stroke-opacity="0.1" />
      <circle cx="140" cy="820" r="170" stroke-width="1.5" />
    </g>
  </g>
</svg>